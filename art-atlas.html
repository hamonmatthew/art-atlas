}\nfunction resize(){let r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);draw()}\nfunction fit(){let maxX=220,maxY=200;for(const p of positions.values()){maxX=Math.max(maxX,Math.abs(p.x)+110);maxY=Math.max(maxY,Math.abs(p.y)+70)}view={x:0,y:0,k:Math.min(1.5,W/(2*maxX),H/(2*maxY))};draw()}\nfunction profile(){const a=movementArtists.get(selected)||[];const top=shown.slice(1,9);let meta=descriptions[selected]||['Movement / school / artistic classification','An exploratory classification drawn from the current artist database. Historical details and relationships require further scholarly review.'];let el=document.getElementById('mv-profile');el.replaceChildren();function add(tag,txt,cls){let e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;el.appendChild(e);return e}add('h3',title(selected));add('p',meta[0]+' · '+a.length+' artists in starter dataset','mv-meta');add('p',meta[1],'mv-meta');add('h2','Related movements');for(const n of top){let s=similarity(selected,n),b=add('button',title(n)+(s.h?' · historical':' · shared classifications'),'mv-btn mv-item');b.onclick=()=>select(n)}add('h2','Artists associated with this movement');if(!a.length)add('p','No artists currently tagged in the starter dataset.','mv-meta');for(const artist of a.slice(0,18)){let b=add('button',artist.name,'mv-btn mv-item');b.onclick=()=>{document.getElementById('artist-mode').click();let search=document.getElementById('search');search.value=artist.name;search.dispatchEvent(new Event('input',{bubbles:true}));}}if(top.length){add('h2','Why these movements connect');for(const n of top.slice(0,4)){let s=similarity(selected,n);add('p',title(n)+': '+(s.h?s.h[2]+'. ':'')+['theme','aesthetic','process'].flatMap(c=>s.parts[c].slice(0,3)).slice(0,6).join(', '),'mv-meta')}}}\nfunction results(){let q=document.getElementById('mv-search').value.toLowerCase().trim(),out=document.getEle >← 2D Atlas<\/a><span style=\"color:#aeb8c1;font-size:12px\">Spatial Explorer · Experimental<\/span><\/header><main><aside><h2>Explore the constellation<\/h2><label>Find an artist<\/label><input id=\"search\" list=\"names\" placeholder=\"Search artists…\"><datalist id=\"names\"><\/datalist><label>X axis<\/label><select id=\"axisX\"><option value=\"time\">Time (birth year)<\/option><option value=\"aesthetic\">Aesthetic embedding<\/option><option value=\"theme\">Theme embedding<\/option><option value=\"process\">Process embedding<\/option><option value=\"movement\">Movement embedding<\/option><\/select><label>Y axis<\/label><select id=\"axisY\"><option value=\"aesthetic\">Aesthetic embedding<\/option><option value=\"time\">Time (birth year)<\/option><option value=\"theme\">Theme embedding<\/option><option value=\"process\">Process embedding<\/option><option value=\"movement\">Movement embedding<\/option><\/select><label>Z axis<\/label><select id=\"axisZ\"><option value=\"theme\">Theme embedding<\/option><option value=\"time\">Time (birth year)<\/option><option value=\"aesthetic\">Aesthetic embedding<\/option><option value=\"process\">Process embedding<\/option><option value=\"movement\">Movement embedding<\/option><\/select><label>Horizontal axis lock<\/label><select id=\"horizontalLock\"><option value=\"none\">Unlocked — free 3D rotation<\/option><option value=\"X\">Lock X to horizontal<\/option><option value=\"Y\">Lock Y to horizontal<\/option><option value=\"Z\">Lock Z to horizontal<\/option><\/select><p class=\"note\" id=\"lockHelp\">Lock an axis to keep its values increasing from left to right at a fixed horizontal scale, unaffected by perspective, while rotating the other dimensions. Drag vertically to rotate around the locked axis; drag horizontally to pan.<\/p><div class=\"time-window\"><h2 style=\"margin:0 0 8px\">Birth-year range<\/h2><p class=\"note\" style=\"margin:5px 0 10px\">Filter artists relative to the selected artist’s birth year. The selected artis
